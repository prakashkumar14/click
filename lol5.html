<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffe6e6">
  <title>Love Me? ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #fff0f3 0%, #ffe6e6 100%);
      color: #d10056;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Comic Sans MS", cursive, sans-serif;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .gif-container {
      margin-bottom: 18px;
    }

    .gif-container img {
      display: block;
      width: clamp(180px, 48vw, 240px);
      height: clamp(160px, 28vh, 220px);
      object-fit: contain;
      border-radius: 20px;
      filter: drop-shadow(0 10px 15px rgba(209, 0, 86, 0.1));
    }

    .question {
      width: 100%;
      margin-bottom: 25px;
      font-size: clamp(1.25rem, 4.8vw, 1.7rem);
      font-weight: 700;
      line-height: 1.35;
      padding: 0 10px;
    }

    .buttons {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      min-height: 60px;
    }

    button {
      min-width: 110px;
      min-height: 50px;
      padding: 12px 24px;
      border: 0;
      border-radius: 50px;
      font-size: clamp(1.05rem, 4.2vw, 1.25rem);
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    #yesBtn {
      background: #ff3366;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(255, 51, 102, 0.35);
    }

    #noBtn {
      border: 2px solid #ff3366;
      background: #ffffff;
      color: #ff3366;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      transition: left 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.15s ease;
    }

    .confetti-piece {
      position: fixed;
      top: -20px;
      z-index: 1000;
      pointer-events: none;
      animation: drop 3.5s linear forwards;
    }

    @keyframes drop {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="gif-container">
      <img
        id="gif"
        src="https://media1.tenor.com/m/al4a1pG1V8YAAAAC/jump-bear.gif"
        alt="Cute Asking Bear"
      >
    </div>

    <div class="question" id="question" aria-live="polite">
      Do you love me? ❤️
    </div>

    <div class="buttons" id="buttons">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttons = document.getElementById("buttons");
    const question = document.getElementById("question");
    const gif = document.getElementById("gif");

    // Yes dabane par sequential romantic & funny sawal
    const yesQuestions = [
      {
        text: "Sach sach batao, mere bina din bhar boring lagta hai na? 😏❤️",
        gif: "https://media.tenor.com/On7kv4pP-6IAAAAi/peach-goma.gif"
      },
      {
        text: "Apni favorite treat aur saari French Fries mujhe doge na? 🍟🥺👉👈",
        gif: "https://media.tenor.com/0v_5b5s_VfAAAAAi/bubu-dudu-sseeyall.gif"
      },
      {
        text: "Late-night calls par mere lame jokes sunke hasna padega, chalega? 😂📞",
        gif: "https://media.tenor.com/1GvhAadQ21MAAAAi/bubu-dudu-cute.gif"
      },
      {
        text: "Khabardaar jo kisi aur ke post like kiye! Deal 100% pakki? 😤💍",
        gif: "https://media.tenor.com/x0qL0Nvdn2AAAAAi/goma-goma-cat.gif"
      }
    ];

    // No dabane par dramatic reactions
    const noDialogues = [
      {
        text: "Hain?! No kaise dabaya? Chashma pehno pehle! 👓😠",
        gif: "https://media.tenor.com/8Q0NqDqN1WkAAAAi/cute-bear.gif",
        btnText: "Galti se daba!"
      },
      {
        text: "Screen touch kharab hai lagta hai tumhara, wapas socho 🥺",
        gif: "https://media.tenor.com/M6Lg5d5b7ZgAAAAi/sad-bear.gif",
        btnText: "Achha ruko..."
      },
      {
        text: "Aise dil todoge mera? Police bulaun kya? 🚔💔",
        gif: "https://media.tenor.com/9nF_X4M_l0YAAAAi/crying-bear.gif",
        btnText: "Nahi maanunga"
      },
      {
        text: "Itna akad? Ab No button click karke dikhao agar dum hai toh! 🏃💨",
        gif: "https://media.tenor.com/al4a1pG1V8YAAAAC/jump-bear.gif",
        btnText: "Pakad ke dikha!"
      }
    ];

    let yesStep = 0;
    let noStep = 0;
    let runAwayActive = false;

    function triggerVibration(pattern = 30) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function moveNoButton() {
      triggerVibration(20);
      const buttonRect = noBtn.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      const padding = 16;
      const maxX = window.innerWidth - buttonRect.width - padding;
      const maxY = window.innerHeight - buttonRect.height - padding;

      let nextX, nextY;
      for (let attempt = 0; attempt < 25; attempt++) {
        nextX = padding + Math.random() * (maxX - padding);
        nextY = padding + Math.random() * (maxY - padding);

        const overlapsYes =
          nextX < yesRect.right + 20 &&
          nextX + buttonRect.width > yesRect.left - 20 &&
          nextY < yesRect.bottom + 20 &&
          nextY + buttonRect.height > yesRect.top - 20;

        if (!overlapsYes) break;
      }

      noBtn.style.position = "fixed";
      noBtn.style.left = `${Math.max(padding, Math.min(nextX, maxX))}px`;
      noBtn.style.top = `${Math.max(padding, Math.min(nextY, maxY))}px`;
    }

    // No Button logic
    noBtn.addEventListener("click", () => {
      triggerVibration(40);

      if (noStep < noDialogues.length) {
        question.textContent = noDialogues[noStep].text;
        gif.src = noDialogues[noStep].gif;
        noBtn.textContent = noDialogues[noStep].btnText;

        // Yes button thoda bada hota jayega
        const currentScale = 1 + (noStep + 1) * 0.15;
        yesBtn.style.transform = `scale(${currentScale})`;

        noStep++;
      } else {
        runAwayActive = true;
        moveNoButton();
      }
    });

    noBtn.addEventListener("touchstart", (e) => {
      if (runAwayActive) {
        e.preventDefault();
        moveNoButton();
      }
    }, { passive: false });

    noBtn.addEventListener("pointerenter", (e) => {
      if (runAwayActive && e.pointerType === "mouse") {
        moveNoButton();
      }
    });

    // Yes Button logic
    yesBtn.addEventListener("click", () => {
      triggerVibration([50, 40, 50]);

      noBtn.style.position = "static";
      runAwayActive = false;
      yesBtn.style.transform = "scale(1)";

      if (yesStep < yesQuestions.length) {
        question.textContent = yesQuestions[yesStep].text;
        gif.src = yesQuestions[yesStep].gif;
        noBtn.textContent = "No";
        noStep = 0;
        yesStep++;
      } else {
        // Final celebration step
        question.textContent = "Yayyy! Mujhse zyada pyar tumhe koi nahi kar sakta! Happy Birthday/Love you meri jaan! 🥳🎉❤️";
        gif.src = "https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif";
        buttons.style.display = "none";
        createConfetti();
        triggerVibration([100, 50, 100]);
      }
    });

    function createConfetti() {
      const items = ["💖", "🌸", "✨", "🎉", "🍬", "🍫"];
      for (let i = 0; i < 45; i++) {
        setTimeout(() => {
          const piece = document.createElement("div");
          piece.className = "confetti-piece";
          piece.textContent = items[Math.floor(Math.random() * items.length)];
          piece.style.left = `${Math.random() * 95}vw`;
          piece.style.fontSize = `${16 + Math.random() * 18}px`;
          piece.style.animationDuration = `${2 + Math.random() * 2}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 4000);
        }, i * 35);
      }
    }
  </script>
</body>
</html>
